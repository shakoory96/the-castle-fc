name: Build Castle social cover
on:
  push:
    branches:
      - feature/approved-visual-hero-stats-share
    paths:
      - scripts/generate_castle_share.py
      - .github/workflows/castle-share-cover.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/approved-visual-hero-stats-share
          persist-credentials: true
      - name: Install fonts and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core
          python -m pip install --quiet Pillow
      - name: Generate share image from official crest
        run: python scripts/generate_castle_share.py
      - name: Commit generated JPEG to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add castle-share.jpg
          if git diff --cached --quiet; then
            echo "Cover already up to date"
          else
            git commit -m "Generate the Castle social cover image"
            git push origin HEAD:feature/approved-visual-hero-stats-share
          fi
