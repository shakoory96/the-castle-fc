<body><div class="app"><aside class="sidebar"><div class="brand"><img src="official_castle_logo.jpg" alt="الشعار الرسمي لفريق القلعة"><div><h1>القلعة</h1><small>THE CASTLE FC</small></div></div><div class="menu-label">عالم القلعة</div><nav class="side-nav" id="desktop-nav"></nav><div class="side-foot"><div class="big"><span class="status"></span> البيانات الحقيقية</div><p>يتم عرض بيانات اللاعبين والمباريات المحفوظة في قاعدة بيانات النادي.</p></div></aside><div class="main-wrap"><header class="topbar"><div class="trail"><span class="mobile-only" style="font-size:20px;color:#63b3ff">♜</span><span>THE CASTLE</span><span>‹</span><b id="bread">الرئيسية</b></div><div class="top-actions"><span class="beta">● LIVE DATA</span><button class="btn sm ghost" data-view="admin">⚙ <span class="hide-small">الإدارة</span></button></div></header><main class="content"><div id="status-notice" class="notice" role="status"></div><div id="screen" aria-live="polite"></div><footer>© THE CASTLE FC • منصة القلعة الرياضية • <a href="https://www.facebook.com/profile.php?id=61594539968482" rel="noopener noreferrer" target="_blank">صفحتنا الرسمية على فيسبوك</a></footer></main></div></div><nav class="mobile-bottom" id="mobile-nav"></nav><div id="drawer"></div><div id="overlay"></div><div class="toast" id="toast" role="status"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>'use strict';
const SUPABASE_URL='https://sfjqaeqabzhnikifpqki.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_lFw3vmM2_NXy8_HCC07EQQ_hK0fQmwo';
const LOGO='official_castle_logo.jpg';
const NAV=[['home','⌂','الرئيسية'],['players','♟','اللاعبون'],['ranking','♛','التصنيف'],['matches','⚽','المباريات'],['fans','♡','الجمهور'],['honors','♜','سجل المجد'],['admin','⚙','الإدارة']];
const state={view:'home',user:null,admin:false,players:[],matches:[],loading:true,error:'',adminTab:'players',playerSearch:'',playerFilter:'الكل'};

return `<section class="hero"><div class="hero-copy"><div class="pill">✦ WELCOME TO THE CASTLE</div><h2>هنا <em>القلعة،</em><br>وهنا يبدأ المجد.</h2><p>بيت القلعة الرقمي: اللاعبون، المباريات، الإنجازات... تاريخنا نكتبه مباراة بعد مباراة.</p><div class="hero-actions"><button class="btn primary" data-view="players">اكتشف نجوم القلعة ←</button><button class="btn ghost" data-view="matches">⚽ مركز المباريات</button></div></div><div class="hero-art"><div class="hero-ring"></div><img src="${LOGO}" alt="الشعار الرسمي للقلعة"><div class="hero-caption">THE CASTLE • EST. WITH PRIDE</div></div></section>

<div class="grid2"><div class="panel"><div class="panel-head"><h3>⚡ المباراة القادمة</h3><button class="sub-link" data-view="matches">مركز المباريات ←</button></div>${up?fixture(up):empty('ماكو مباراة قادمة مسجلة حالياً.')}</div><div class="panel"><div class="panel-head"><h3>🏅 عرش القلعة</h3><button class="sub-link" data-view="ranking">التصنيف الكامل ←</button></div>${sortedRatings().length?sortedRatings().slice(0,4).map((p,i)=>`<div class="pair"><span>${i+1}. ${esc(p.name)}</span><b style="color:#83c9ff">${fmt(p.rating)}</b></div>`).join(''):empty('التقييمات ما انضافت بعد، لذلك ماكو ترتيب افتراضي.')}</div></div>
<div class="panel" style="margin-top:20px"><div class="panel-head"><h3>⚽ آخر النتائج</h3><button class="sub-link" data-view="matches">كل النتائج ←</button></div>${past.length?`<div class="card-list">${past.map(fixture).join('')}</div>`:empty('بعد ما مسجلين مباريات مكتملة.')}</div>`}
function fixture(m){let completed=m.status==='completed',score=completed?`${fmt(m.our_score)} - ${fmt(m.opponent_score)}`:m.status==='cancelled'?'ملغاة':'VS';let cls=completed?(m.our_score>m.opponent_score?'win':m.our_score<m.opponent_score?'loss':''):' ';return `<button class="fixture" data-match="${esc(m.id)}" style="width:100%;text-align:right;color:inherit;cursor:pointer"><div><div class="comp">${esc(m.competition||'مباراة')} · ${dateFmt(m.match_date)}</div><div class="op">القلعة</div></div><div class="mid ${cls}">${score}</div><div><div class="comp">${m.venue?esc(m.venue):'منافسة رياضية'}</div><div class="op">${esc(m.opponent_name)}</div></div></button>`}
function players(){let q=state.playerSearch.trim(),list=state.players.filter(p=>(state.admin||p.is_active!==false)&&(!q||p.name.includes(q))&&(state.playerFilter==='الكل'||p.position===state.playerFilter));return `${title('نجوم القلعة','ملفات اللاعبين الحقيقيين المسجلين بقاعدة بيانات النادي.')}

${list.length?`<div class="live-grid">${list.map(p=>`<button class="live-player" data-player="${esc(p.id)}" title="ملف اللاعب">${avatar(p)}<div class="num-chip">#${p.jersey_number==null?'—':fmt(p.jersey_number)}</div><div class="name">${esc(p.name)}</div><div class="muted">${esc(p.position||'لم يُحدد المركز')}</div><div class="rating-pill">التقييم: ${p.rating==null?'غير محدد':fmt(p.rating)}</div>${p.is_active===false?'<span class="badge-status">غير نشط</span>':''}</button>`).join('')}</div>`:empty('لا يوجد لاعبون مطابقون للبحث.')}`}
function ranking(){let list=sortedRatings();return `${title('عرش القلعة','التقييمات اليدوية المعتمدة من الإدارة — ليست نتائج تلقائية بعد.',`<span class="badge">POWER RANKING</span>`)}<div class="panel">${list.length?`<div class="table-wrap"><table class="live-table"><thead><tr><th>المركز</th><th>اللاعب</th><th>المركز الرياضي</th><th>التقييم / 100</th></tr></thead><tbody>${list.map((p,i)=>`<tr><td><b>${fmt(i+1)}</b></td><td>${esc(p.name)}</td><td>${esc(p.position||'—')}</td><td><b style="color:#6ab7ff">${fmt(p.rating)}</b></td></tr>`).join('')}</tbody></table></div>`:empty('ما تم إدخال تقييمات اللاعبين بعد. راح يظهر التصنيف من نبدأ نسجّل تقييمات معتمدة.')}</div><div class="callout" style="margin-top:15px">ℹ التقييم الحالي يُدخل يدوياً من مدير الفريق. نظام التقييم المتقدم لكل مركز راح نضيفه بمرحلة قادمة بعد الاتفاق على المعايير.</div>`}

<div class="panel"><div class="eyebrow">COMING SOON · قريباً</div><h3>توقع النتائج والتصويت لنجم المباراة</h3><p class="muted">راح نفتح التوقعات والتصويت بعد تجهيز نظام يمنع التكرار ويحفظ الأصوات للجميع بشكل آمن. ماكو نتائج أو تصويت تجريبي منشور حالياً.</p><p>تابع أخبار النادي عبر <a href="https://www.facebook.com/profile.php?id=61594539968482" rel="noopener noreferrer" target="_blank" style="color:#76c5ff;text-decoration:underline">صفحة القلعة على فيسبوك</a>.</p></div>`}

<div class="panel"><h3>♜ تاريخنا قيد التوثيق</h3><p class="muted">راح يظهر هنا سجل البطولات والجوائز بعد إدخال إنجازات الفريق الحقيقية. ما نعرض إنجازات افتراضية.</p></div>`}
function loginForm(){return `<div class="panel welcome-login"><div class="eyebrow">CASTLE CONTROL</div><h3>تسجيل دخول مدير القلعة</h3><p class="muted">استخدم إيميل وكلمة مرور حساب الموقع اللي أنشأته داخل Supabase → Authentication → Users، مو حساب GitHub.</p><form id="login-form" class="form-grid"><div class="field full"><label for="auth-email">البريد الإلكتروني</label><input id="auth-email" name="email" type="email" required autocomplete="username"></div><div class="field full"><label for="auth-pass">كلمة المرور</label><input id="auth-pass" name="password" type="password" required autocomplete="current-password" minlength="6"></div><div class="field full"><button class="btn primary" type="submit">دخول الإدارة</button></div></form></div>`}
function admin(){if(!state.user)return `${title('غرفة القيادة','التحكم بمعلومات فريق القلعة.')}${loginForm()}`;if(!state.admin)return `${title('غرفة القيادة','صلاحيات الموقع')}
<div class="panel"><p class="notice error"><span>هذا الحساب مسجّل لكن ما عنده صلاحية مدير القلعة. تأكد من إضافة حسابك إلى private.castle_admins.</span></p><button class="btn ghost" id="logout-btn">تسجيل الخروج</button></div>`;
return `${title('غرفة قيادة القلعة',`أهلاً بك — ${esc(state.user.email||'مدير القلعة')}`,`<button class="btn ghost sm" id="logout-btn">تسجيل الخروج</button>`)}
<div class="callout" style="margin-bottom:20px">🛡 الإضافات والتعديلات محفوظة مباشرة في Supabase وتظهر لكل زوار الموقع. الصور تُرفع إلى مساحة النادي.</div>
<div class="admin-switch"><button class="btn sm ${state.adminTab==='players'?'active':''}" data-admin-tab="players">♟ إدارة اللاعبين</button><button class="btn sm ${state.adminTab==='matches'?'active':''}" data-admin-tab="matches">⚽ إدارة المباريات</button><button class="btn sm" id="refresh-btn">↻ تحديث البيانات</button></div>
${state.adminTab==='players'?adminPlayers():adminMatches()}`}
function adminPlayers(){return `<div class="panel"><div class="panel-head"><h3>إضافة لاعب</h3><span class="tiny">الاسم مطلوب، والبقية اختيارية</span></div>${playerForm()}</div>
<div class="panel" style="margin-top:18px"><h3>قائمة اللاعبين (${fmt(state.players.length)})</h3><div class="table-wrap"><table class="live-table"><thead><tr><th>الاسم</th><th>الرقم</th><th>المركز</th><th>الحالة</th><th>الإجراءات</th></tr></thead><tbody>${state.players.map(p=>`<tr><td><div class="row-player">${avatar(p,'mini-photo-wrap')}<b>${esc(p.name)}</b></div></td><td>${p.jersey_number==null?'—':fmt(p.jersey_number)}</td><td>${esc(p.position||'—')}</td><td>${p.is_active?'نشط':'مخفي'}</td><td><button class="btn sm" data-edit-player="${esc(p.id)}">تعديل</button> <button class="btn sm danger" data-delete-player="${esc(p.id)}">حذف</button></td></tr>`).join('')||'<tr><td colspan="5">لا يوجد لاعبون بعد.</td></tr>'}</tbody></table></div></div>`}
function playerForm(p){p=p||{};return `<form class="form-grid" id="player-form" data-id="${esc(p.id||'')}"><div class="field"><label>اسم اللاعب *</label><input name="name" required maxlength="75" value="${esc(p.name||'')}"></div><div class="field"><label>رقم القميص</label><input name="jersey_number" type="number" min="0" max="99" value="${p.jersey_number??''}"></div><div class="field"><label>مركز اللاعب</label><input name="position" list="positions-list" maxlength="60" value="${esc(p.position||'')}"><datalist id="positions-list">${positions.map(x=>`<option value="${esc(x)}">`).join('')}</datalist></div><div class="field"><label>تقييم اللاعب /100 (اختياري)</label><input name="rating" type="number" min="0" max="100" value="${p.rating??''}"></div><div class="field"><label>المشاركات (إدخال يدوي)</label><input name="appearances" type="number" min="0" value="${p.appearances??''}"></div><div class="field"><label>الأهداف (إدخال يدوي)</label><input name="goals" type="number" min="0" value="${p.goals??''}"></div><div class="field"><label>الصناعات (إدخال يدوي)</label><input name="assists" type="number" min="0" value="${p.assists??''}"></div><div class="field"><label>شباك نظيفة (إدخال يدوي)</label><input name="clean_sheets" type="number" min="0" value="${p.clean_sheets??''}"></div><div class="field full"><label>صورة اللاعب (JPG/PNG/WebP، حتى 3MB)</label><input name="photo" type="file" accept="image/jpeg,image/png,image/webp"><small class="muted">إذا خليتها فارغة، نحتفظ بالصورة الحالية إن وجدت.</small></div><div class="field full"><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" name="is_active" ${p.is_active!==false?'checked':''} style="width:auto;min-height:0"> إظهار اللاعب للجمهور</label></div><div class="field full"><button type="submit" class="btn primary">${p.id?'حفظ تعديل اللاعب':'إضافة اللاعب'}</button></div></form>`}
function adminMatches(){return `<div class="panel"><div class="panel-head"><h3>تسجيل مباراة</h3><span class="tiny">النتيجة للمباراة المكتملة فقط</span></div>${matchForm()}</div><div class="panel" style="margin-top:18px"><h3>المباريات المسجلة</h3><div class="table-wrap"><table class="live-table"><thead><tr><th>المنافس</th><th>التاريخ</th><th>الحالة</th><th>النتيجة</th><th>الإجراءات</th></tr></thead><tbody>${matchesSorted().map(m=>`<tr><td>${esc(m.opponent_name)}</td><td>${dateFmt(m.match_date)}</td><td>${m.status==='completed'?'مكتملة':m.status==='scheduled'?'قادمة':'ملغاة'}</td><td>${m.status==='completed'?`${fmt(m.our_score)} - ${fmt(m.opponent_score)}`:'—'}</td><td><button class="btn sm" data-edit-match="${esc(m.id)}">تعديل</button> <button class="btn sm danger" data-delete-match="${esc(m.id)}">حذف</button></td></tr>`).join('')||'<tr><td colspan="5">لا توجد مباريات.</td></tr>'}</tbody></table></div></div>`}
function matchForm(m){m=m||{};return `<form id="match-form" class="form-grid" data-id="${esc(m.id||'')}"><div class="field"><label>الفريق المنافس *</label><input name="opponent_name" required maxlength="100" value="${esc(m.opponent_name||'')}"></div><div class="field"><label>التاريخ *</label><input name="match_date" type="date" required value="${esc(m.match_date||'')}"></div><div class="field"><label>وقت المباراة (اختياري)</label><input name="kickoff_time" type="time" value="${esc(m.kickoff_time||'').slice(0,5)}"></div><div class="field"><label>البطولة</label><input name="competition" maxlength="100" value="${esc(m.competition||'')}"></div><div class="field"><label>الملعب</label><input name="venue" maxlength="100" value="${esc(m.venue||'')}"></div><div class="field"><label>حالة المباراة</label><select name="status"><option value="scheduled" ${m.status==='scheduled'||!m.status?'selected':''}>مجدولة</option><option value="completed" ${m.status==='completed'?'selected':''}>مكتملة</option><option value="cancelled" ${m.status==='cancelled'?'selected':''}>ملغاة</option></select></div><div class="field"><label>أهداف القلعة</label><input name="our_score" type="number" min="0" max="99" placeholder="للمكتملة فقط" value="${m.our_score??''}"></div><div class="field"><label>أهداف المنافس</label><input name="opponent_score" type="number" min="0" max="99" placeholder="للمكتملة فقط" value="${m.opponent_score??''}"></div><div class="field full"><label>ملاحظات</label><textarea name="notes" maxlength="1000">${esc(m.notes||'')}</textarea></div><div class="field full"><button class="btn primary" type="submit">${m.id?'حفظ التعديل':'تسجيل المباراة'}</button></div></form>`}
function showPlayer(id){let p=state.players.find(x=>x.id===id);if(!p)return;modal(`<div style="text-align:center">${avatar(p)}<div class="eyebrow">THE CASTLE PLAYER ID</div><h2>${esc(p.name)}</h2><div class="muted">رقم ${p.jersey_number??'—'} · ${esc(p.position||'—')}</div><div class="num-chip" style="font-size:44px">${p.rating==null?'—':fmt(p.rating)}</div><div class="tiny">تقييم يدوي</div></div><div class="grid-cards" style="margin-top:20px">${[['المشاركات',p.appearances],['الأهداف',p.goals],['الصناعات',p.assists],['شباك نظيفة',p.clean_sheets]].map(([n,v])=>`<div class="panel"><div class="lbl">${n}</div><div class="big-stat">${v==null?'—':fmt(v)}</div></div>`).join('')}</div>`)}
function showMatch(id){let m=state.matches.find(x=>x.id===id);if(!m)return;modal(`<div class="eyebrow">CASTLE MATCH CENTER</div><h2>${esc(m.opponent_name)}</h2>${fixture(m)}<div class="pair"><span>التاريخ</span><b>${dateFmt(m.match_date)}</b></div><div class="pair"><span>الوقت</span><b>${esc(m.kickoff_time?.slice(0,5)||'غير محدد')}</b></div><div class="pair"><span>البطولة</span><b>${esc(m.competition||'—')}</b></div><div class="pair"><span>الملعب</span><b>${esc(m.venue||'—')}</b></div>${m.notes?`<div class="pair"><span>ملاحظات</span><b>${esc(m.notes)}</b></div>`:''}`)}
function modal(html){document.getElementById('overlay').innerHTML=`<div class="modal-overlay" data-close="1"><div class="modal" role="dialog" aria-modal="true"><button class="close" data-close="1" aria-label="إغلاق">×</button>${html}</div></div>`}
function closeModal(){document.getElementById('overlay').innerHTML=''}
function render(){document.getElementById('desktop-nav').innerHTML=navHtml();document.getElementById('mobile-nav').innerHTML=navHtml(true);document.getElementById('bread').textContent=NAV.find(n=>n[0]===state.view)?.[2]||'الرئيسية';let banner=document.getElementById('status-notice');banner.className='notice '+(state.error?'error':'success');banner.innerHTML=`<span>✦</span><span class="notice-txt">${state.error?`تعذّر الاتصال بقاعدة البيانات: ${esc(state.error)}. لم نعرض أي بيانات تجريبية.`:state.loading?'جاري جلب بيانات القلعة الحقيقية...':'بيانات الموقع مرتبطة بقاعدة Supabase. لا يوجد محتوى تجريبي.'}</span>${!state.loading?'<button class="btn sm" id="refresh-btn">↻ تحديث</button>':''}`;let pages={home,players,ranking,matches,fans,honors,admin};document.getElementById('screen').innerHTML=state.loading?empty('جاري تحميل البيانات...'):(pages[state.view]||home)();let b=document.querySelector('.beta');b.textContent=state.error?'● OFFLINE':'● LIVE DATA';b.classList.toggle('live-status',!state.error);}
function go(view){state.view=view;closeModal();render();window.scrollTo({top:0,behavior:'smooth'})}
function mapErr(err){if(!err)return 'خطأ غير معروف';return /invalid login credentials/i.test(err.message||'')?'بيانات تسجيل الدخول غير صحيحة.':(err.message||String(err))}
async function refresh(){if(!client){state.error='تعذر تحميل مكتبة الاتصال. تحقق من الإنترنت.';state.loading=false;render();return}state.loading=true;state.error='';render();try{const authRes=await client.auth.getUser();state.user=authRes.data?.user||null;state.admin=false;if(state.user){const r=await client.rpc('castle_admin_status');if(r.error)throw new Error('تعذر التأكد من صلاحيات المدير: '+mapErr(r.error));state.admin=r.data===true}const [pr,mr]=await Promise.all([client.from('players').select('*').order('created_at',{ascending:false}),client.from('matches').select('*').order('match_date',{ascending:false})]);if(pr.error)throw pr.error;if(mr.error)throw mr.error;state.players=pr.data||[];state.matches=mr.data||[];}catch(e){state.error=mapErr(e);state.players=[];state.matches=[];}finally{state.loading=false;render()}}
async function uploadPhoto(file){if(!file)return null;if(file.size>3*1024*1024)throw new Error('حجم الصورة أكبر من 3MB');if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('اختر صورة JPG أو PNG أو WebP');let ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[file.type];const path=`players/${crypto.randomUUID()}.${ext}`;let up=await client.storage.from('castle-player-photos').upload(path,file,{contentType:file.type,upsert:false});if(up.error)throw up.error;return client.storage.from('castle-player-photos').getPublicUrl(path).data.publicUrl}
async function submitPlayer(form){if(!state.admin)return notify('هذا الإجراء خاص بمدير القلعة');const f=new FormData(form),id=form.dataset.id;let name=String(f.get('name')||'').trim();if(!name)throw new Error('اسم اللاعب مطلوب.');const intOrNull=(key)=>{let v=String(f.get(key)||'').trim();return v===''?null:Number(v)};const payload={name,jersey_number:intOrNull('jersey_number'),position:String(f.get('position')||'').trim()||null,rating:intOrNull('rating'),appearances:intOrNull('appearances'),goals:intOrNull('goals'),assists:intOrNull('assists'),clean_sheets:intOrNull('clean_sheets'),is_active:f.get('is_active')==='on'};let photo=await uploadPhoto(form.querySelector('[name="photo"]').files[0]);if(photo)payload.photo_url=photo;const q=id?client.from('players').update(payload).eq('id',id):client.from('players').insert(payload);let res=await q.select('id');if(res.error)throw res.error;closeModal();notify(id?'تم تعديل اللاعب':'تمت إضافة اللاعب');await refresh()}
async function submitMatch(form){if(!state.admin)return notify('هذا الإجراء خاص بمدير القلعة');const f=new FormData(form),id=form.dataset.id;let status=String(f.get('status'));const completed=status==='completed';let a=String(f.get('our_score')||'').trim(),b=String(f.get('opponent_score')||'').trim();if(completed&&(a===''||b===''))throw new Error('أدخل نتيجتي الفريقين للمباراة المكتملة');let payload={opponent_name:String(f.get('opponent_name')||'').trim(),match_date:String(f.get('match_date')||''),kickoff_time:String(f.get('kickoff_time')||'')||null,competition:String(f.get('competition')||'').trim()||null,venue:String(f.get('venue')||'').trim()||null,status,our_score:completed?Number(a):null,opponent_score:completed?Number(b):null,notes:String(f.get('notes')||'').trim()||null};if(!payload.opponent_name||!payload.match_date)throw new Error('اسم المنافس والتاريخ مطلوبان');const q=id?client.from('matches').update(payload).eq('id',id):client.from('matches').insert(payload);let res=await q.select('id');if(res.error)throw res.error;closeModal();notify(id?'تم تعديل المباراة':'تم تسجيل المباراة');await refresh()}
async function guardedRun(btn,task){if(btn)btn.disabled=true;try{await task()}catch(e){notify('خطأ: '+mapErr(e));console.error(e)}finally{if(btn?.isConnected)btn.disabled=false}}
document.addEventListener('click',async e=>{let v=e.target.closest('[data-view]');if(v){go(v.dataset.view);return}let pc=e.target.closest('[data-player]');if(pc){showPlayer(pc.dataset.player);return}let mt=e.target.closest('[data-match]');if(mt){showMatch(mt.dataset.match);return}let close=e.target.closest('[data-close]');if(close&&(e.target===close||e.target.closest('button[data-close]'))){closeModal();return}let adminTab=e.target.closest('[data-admin-tab]');if(adminTab){state.adminTab=adminTab.dataset.adminTab;render();return}let editP=e.target.closest('[data-edit-player]');if(editP&&state.admin){let p=state.players.find(x=>x.id===editP.dataset.editPlayer);if(p)modal(`<h2>تعديل اللاعب</h2>${playerForm(p)}`);return}let editM=e.target.closest('[data-edit-match]');if(editM&&state.admin){let m=state.matches.find(x=>x.id===editM.dataset.editMatch);if(m)modal(`<h2>تعديل المباراة</h2>${matchForm(m)}`);return}let deleteP=e.target.closest('[data-delete-player]');if(deleteP&&state.admin){let p=state.players.find(x=>x.id===deleteP.dataset.deletePlayer);if(p&&confirm(`حذف اللاعب ${p.name} نهائياً؟`))await guardedRun(deleteP,async()=>{let r=await client.from('players').delete().eq('id',p.id);if(r.error)throw r.error;notify('تم الحذف');await refresh()});return}let deleteM=e.target.closest('[data-delete-match]');if(deleteM&&state.admin){let m=state.matches.find(x=>x.id===deleteM.dataset.deleteMatch);if(m&&confirm(`حذف المباراة أمام ${m.opponent_name} نهائياً؟`))await guardedRun(deleteM,async()=>{let r=await client.from('matches').delete().eq('id',m.id);if(r.error)throw r.error;notify('تم الحذف');await refresh()});return}if(e.target.closest('#refresh-btn')){await refresh();return}if(e.target.closest('#logout-btn')){let r=await client.auth.signOut();if(r.error)notify(mapErr(r.error));state.admin=false;state.user=null;await refresh();go('home')}});
document.addEventListener('input',e=>{if(e.target.id==='player-search'){state.playerSearch=e.target.value;let pos=e.target.selectionStart;render();let field=document.getElementById('player-search');if(field){field.focus();field.setSelectionRange(pos,pos)}}});
document.addEventListener('change',e=>{if(e.target.id==='position-filter'){state.playerFilter=e.target.value;render()}});
document.addEventListener('submit',async e=>{const form=e.target;if(!['player-form','match-form','login-form'].includes(form.id))return;e.preventDefault();let btn=form.querySelector('[type=submit]');await guardedRun(btn,async()=>{if(form.id==='player-form')return submitPlayer(form);if(form.id==='match-form')return submitMatch(form);if(form.id==='login-form'){const f=new FormData(form);let r=await client.auth.signInWithPassword({email:String(f.get('email')||'').trim(),password:String(f.get('password')||'')});if(r.error)throw r.error;notify('تم تسجيل الدخول');await refresh();if(!state.admin)notify('الحساب ليس ضمن قائمة مديري القلعة.')}})});
(async function boot(){if(!window.supabase?.createClient){state.error='مكتبة Supabase غير متوفرة. تأكد من اتصال الإنترنت';state.loading=false;render();return}client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);await refresh()})();
</script></body></html>
