function render(){syncAppearance();NAV.splice(0,NAV.length,...navItems().map(n=>[n.id,n.icon,n.label]));document.getElementById('desktop-nav').innerHTML=navHtml();document.getElementById('mobile-nav').innerHTML=navHtml(true);document.getElementById('bread').textContent=NAV.find(n=>n[0]===state.view)?.[2]||(state.view==='admin'?'الإدارة':'الرئيسية');let banner=document.getElementById('status-notice');banner.className='notice '+(state.error?'error':'success');banner.innerHTML=`<span>✦</span><span class="notice-txt">${state.previewMode?'معاينة شخصية غير منشورة: اضغط «العودة للتحرير» حتى ترجع للإعدادات.':state.error?`تعذّر الاتصال بقاعدة البيانات: ${esc(state.error)}. لم نعرض أي بيانات تجريبية.`:state.loading?'جاري جلب بيانات القلعة الحقيقية...':'بيانات الموقع مرتبطة بقاعدة Supabase. لا يوجد محتوى تجريبي.'}</span>${state.previewMode?'<button class="btn sm" id="cms-back-edit">العودة للتحرير</button>':!state.loading?'<button class="btn sm" id="refresh-btn">↻ تحديث</button>':''}`;let pages={home,players,ranking,matches,fans,honors,admin};document.getElementById('screen').innerHTML=state.loading?empty('جاري تحميل البيانات...'):(pages[state.view]||customPage)();let b=document.querySelector('.beta');b.textContent=state.error?'● OFFLINE':state.previewMode?'◉ معاينة خاصة':'● LIVE DATA';b.classList.toggle('live-status',!state.error);}
function go(view){state.view=view;closeModal();render();window.scrollTo({top:0,behavior:'smooth'})}
function mapErr(err){if(!err)return 'خطأ غير معروف';return /invalid login credentials/i.test(err.message||'')?'بيانات تسجيل الدخول غير صحيحة.':(err.message||String(err))}
async function refresh(){if(!client){state.error='تعذر تحميل مكتبة الاتصال. تحقق من الإنترنت.';state.loading=false;render();return}state.loading=true;state.error='';render();try{const authRes=await client.auth.getUser();state.user=authRes.data?.user||null;state.admin=false;if(state.user){const r=await client.rpc('castle_admin_status');if(r.error)throw new Error('تعذر التأكد من صلاحيات المدير: '+mapErr(r.error));state.admin=r.data===true}const [pr,mr,sr]=await Promise.all([client.from('players').select('*').order('created_at',{ascending:false}),client.from('matches').select('*').order('match_date',{ascending:false}),client.from('site_settings').select('config,version').eq('id',1).single()]);if(pr.error)throw pr.error;if(mr.error)throw mr.error;if(sr.error)throw new Error('إعدادات الموقع: '+mapErr(sr.error));state.players=pr.data||[];state.matches=mr.data||[];state.config=normalizeSite(sr.data.config);state.configVersion=sr.data.version;if(!state.draft)state.draft=cloneObj(state.config);}catch(e){state.error=mapErr(e);state.players=[];state.matches=[];}finally{state.loading=false;render()}}
async function uploadPhoto(file){if(!file)return null;if(file.size>3*1024*1024)throw new Error('حجم الصورة أكبر من 3MB');if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('اختر صورة JPG أو PNG أو WebP');let ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[file.type];const path=`players/${crypto.randomUUID()}.${ext}`;let up=await client.storage.from('castle-player-photos').upload(path,file,{contentType:file.type,upsert:false});if(up.error)throw up.error;return client.storage.from('castle-player-photos').getPublicUrl(path).data.publicUrl}
async function submitPlayer(form){if(!state.admin)return notify('هذا الإجراء خاص بمدير القلعة');const f=new FormData(form),id=form.dataset.id;let name=String(f.get('name')||'').trim();if(!name)throw new Error('اسم اللاعب مطلوب.');const intOrNull=(key)=>{let v=String(f.get(key)||'').trim();return v===''?null:Number(v)};const payload={name,jersey_number:intOrNull('jersey_number'),position:String(f.get('position')||'').trim()||null,rating:intOrNull('rating'),appearances:intOrNull('appearances'),goals:intOrNull('goals'),assists:intOrNull('assists'),clean_sheets:intOrNull('clean_sheets'),is_active:f.get('is_active')==='on'};let photo=await uploadPhoto(form.querySelector('[name="photo"]').files[0]);if(photo)payload.photo_url=photo;const q=id?client.from('players').update(payload).eq('id',id):client.from('players').insert(payload);let res=await q.select('id');if(res.error)throw res.error;closeModal();notify(id?'تم تعديل اللاعب':'تمت إضافة اللاعب');await refresh()}
async function submitMatch(form){if(!state.admin)return notify('هذا الإجراء خاص بمدير القلعة');const f=new FormData(form),id=form.dataset.id;let status=String(f.get('status'));const completed=status==='completed';let a=String(f.get('our_score')||'').trim(),b=String(f.get('opponent_score')||'').trim();if(completed&&(a===''||b===''))throw new Error('أدخل نتيجتي الفريقين للمباراة المكتملة');let payload={opponent_name:String(f.get('opponent_name')||'').trim(),match_date:String(f.get('match_date')||''),kickoff_time:String(f.get('kickoff_time')||'')||null,competition:String(f.get('competition')||'').trim()||null,venue:String(f.get('venue')||'').trim()||null,status,our_score:completed?Number(a):null,opponent_score:completed?Number(b):null,notes:String(f.get('notes')||'').trim()||null};if(!payload.opponent_name||!payload.match_date)throw new Error('اسم المنافس والتاريخ مطلوبان');const q=id?client.from('matches').update(payload).eq('id',id):client.from('matches').insert(payload);let res=await q.select('id');if(res.error)throw res.error;closeModal();notify(id?'تم تعديل المباراة':'تم تسجيل المباراة');await refresh()}
async function guardedRun(btn,task){if(btn)btn.disabled=true;try{await task()}catch(e){notify('خطأ: '+mapErr(e));console.error(e)}finally{if(btn?.isConnected)btn.disabled=false}}
document.addEventListener('click',async e=>{
  if(e.target.closest('[data-show-menu]')){modal('<h2>أقسام الموقع</h2><div class="cms-menu-popup">'+navHtml(false)+'</div>');return}
  if(e.target.closest('#cms-back-edit')){state.adminTab='studio';state.previewMode=false;go('admin');return}
  const tab=e.target.closest('[data-cms-tab]');if(tab&&state.admin){state.editorTab=tab.dataset.cmsTab;rerenderCms();return}
  const move=e.target.closest('[data-cms-navmove]');if(move&&state.admin){const i=Number(move.dataset.index),j=move.dataset.cmsNavmove==='up'?i-1:i+1;if(i>=0&&j>=0&&j<state.draft.navigation.length){[state.draft.navigation[i],state.draft.navigation[j]]=[state.draft.navigation[j],state.draft.navigation[i]];rerenderCms()}return}
  if(e.target.closest('[data-cms-add-card]')&&state.admin){if(state.draft.homeCards.length<30){state.draft.homeCards.push({title:'بطاقة جديدة',body:'اكتب وصف البطاقة هنا',imageUrl:'',linkText:'',linkUrl:'',visible:true});rerenderCms()}return}
  const remCard=e.target.closest('[data-cms-remove-card]');if(remCard&&state.admin){if(confirm('حذف هذه البطاقة من المسودة؟')){state.draft.homeCards.splice(Number(remCard.dataset.cmsRemoveCard),1);rerenderCms()}return}
  if(e.target.closest('[data-cms-add-page]')&&state.admin){if(state.draft.customPages.length>=15){notify('الحد الأقصى 15 صفحة إضافية');return}const id='custom-'+(crypto.randomUUID?.()||Math.random().toString(36).slice(2)).slice(0,12);state.draft.customPages.push({id,title:'صفحة جديدة',subtitle:'',body:'',imageUrl:'',linkText:'',linkUrl:'',visible:true});state.draft.navigation.push({id,icon:'✦',label:'صفحة جديدة',visible:true});rerenderCms();return}
  const remPage=e.target.closest('[data-cms-remove-page]');if(remPage&&state.admin){const i=Number(remPage.dataset.cmsRemovePage),p=state.draft.customPages[i];if(p&&confirm('حذف هذه الصفحة وتبويبها من المسودة؟')){state.draft.navigation=state.draft.navigation.filter(n=>n.id!==p.id);state.draft.customPages.splice(i,1);rerenderCms()}return}
  const clear=e.target.closest('[data-cms-clear]');if(clear&&state.admin){setPath(state.draft,clear.dataset.cmsClear,'');rerenderCms();return}
  if(e.target.closest('#cms-save')&&state.admin){await guardedRun(e.target.closest('button'),saveCms);return}
  if(e.target.closest('#cms-preview')&&state.admin){state.previewMode=true;go('home');return}
  if(e.target.closest('#cms-discard')&&state.admin){if(confirm('إلغاء التغييرات غير المنشورة؟')){state.draft=cloneObj(state.config);rerenderCms()}return}
  if(e.target.closest('#cms-export')&&state.admin){cmsBackup();return}

function cloneObj(value){return JSON.parse(JSON.stringify(value))}

    theme:{...DEFAULT_SITE.theme,...(c.theme||{})},
    texts:{...DEFAULT_SITE.texts,...(c.texts||{})},
    sections:{...DEFAULT_SITE.sections,...(c.sections||{})},
    navigation:Array.isArray(c.navigation)&&c.navigation.length?c.navigation:cloneObj(DEFAULT_SITE.navigation),
    homeCards:Array.isArray(c.homeCards)?c.homeCards:[],
    customPages:Array.isArray(c.customPages)?c.customPages:[]

   opts.type==='color'?`<input ${attr} type="color" value="${allowedHex(value,'#2589ff')}">`:

  <p class="tiny">لا تضع أسراراً أو كلمات مرور داخل النصوص؛ كل ما تنشره هنا يُعرض للزوار. لن تتأثر سجلات اللاعبين والمباريات.</p></section>`;
}
function setPath(obj,path,value){let seg=path.split('.'),v=obj;for(let i=0;i<seg.length-1;i++){if(!v||!Object.hasOwn(v,seg[i]))return;v=v[seg[i]]}if(v&&Object.hasOwn(v,seg.at(-1)))v[seg.at(-1)]=value}
function rerenderCms(){state.view='admin';state.previewMode=false;render()}
async function saveCms(){if(!state.admin||!state.draft)throw new Error('تسجيل الدخول مطلوب');
  const cfg=cloneObj(state.draft);
  if(cfg.navigation.length>20||cfg.homeCards.length>30||cfg.customPages.length>15)throw new Error('تم تجاوز حدود صفحات وأقسام الموقع');
  const payload=JSON.stringify(cfg);
  if(new TextEncoder().encode(payload).length>200000)throw new Error('المحتوى كبير جداً. قلّل النصوص أو الصور المضمّنة.');
  const r=await client.from('site_settings').update({config:cfg,version:state.configVersion+1,updated_at:new Date().toISOString()})
    .eq('id',1).eq('version',state.configVersion).select('version').single();
  if(r.error)throw new Error(r.error.message?.includes('0 rows')?'حدث تعديل من جلسة أخرى، اضغط تحديث البيانات وراجع التغييرات.':r.error.message);
  state.config=normalizeSite(cfg);state.configVersion=r.data.version;state.draft=cloneObj(cfg);state.previewMode=false;
  notify('تم نشر إعدادات الموقع بنجاح لكل الزوار');render();
}
async function uploadCmsImage(path,file){if(!state.admin)throw new Error('ليس لديك صلاحية رفع الملفات');
  if(!file||!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('الصيغة المطلوبة JPG أو PNG أو WebP');
  if(file.size>3*1024*1024)throw new Error('الحد الأقصى للصورة 3MB');
  const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[file.type];
  const p='site/'+crypto.randomUUID()+'.'+ext;
  const r=await client.storage.from('castle-site-assets').upload(p,file,{contentType:file.type,upsert:false});
  if(r.error)throw r.error;
  const publicUrl=client.storage.from('castle-site-assets').getPublicUrl(p).data.publicUrl;
  setPath(state.draft,path,publicUrl);notify('رُفعت الصورة. اضغط «نشر التغييرات» حتى تظهر للجميع.');rerenderCms();
}
function cmsBackup(){const blob=new Blob([JSON.stringify(state.draft,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='the-castle-settings-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

async function restoreCmsFile(file){
 if(!state.admin||!file)throw new Error('إدارة الموقع فقط');
 if(file.size>250000)throw new Error('ملف الإعدادات كبير جداً');
 let input;
 try{input=JSON.parse(await file.text())}catch{throw new Error('ملف JSON غير صالح')}
 if(!input||typeof input!=='object'||Array.isArray(input))throw new Error('صيغة الملف غير صحيحة');
 state.draft=normalizeSite(input);state.previewMode=false;notify('تم تحميل النسخة الاحتياطية كمسودة فقط؛ راجعها ثم انشرها.');rerenderCms();
}

(async function boot(){if(!window.supabase?.createClient){state.error='مكتبة Supabase غير متوفرة. تأكد من اتصال الإنترنت';state.loading=false;render();return}client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);await refresh()})();
</script></body></html>
